$kind: http-request
url: "{{baseUrl}}/rentals"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{tenantToken}}
body:
  type: text
  content: |-
    {
      "propertyId": "{{propertyId}}",
      "moveInDate": "2026-08-01",
      "durationMonths": 12,
      "message": "Looking forward to renting this place."
    }
order: 1000
